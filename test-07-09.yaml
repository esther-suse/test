apiVersion: neuvector.com/v1
kind: NvAdmissionControlSecurityRule
metadata:
  name: local
spec:
  rules:
  - action: allow
    comment: a exception rule
    containers:
    - containers
    conversion_id_ref: 1000
    criteria:
    - name: image
      op: containsAny
      path: image
      value: nvlab/iperf
    disabled: false
  - action: deny
    comment: a deny rule
    containers:
    - containers
    conversion_id_ref: 1001
    criteria:
    - name: labels
      op: containsAny
      path: labels
      value: test
    disabled: false
    rule_mode: ""

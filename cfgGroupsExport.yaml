apiVersion: v1
items:
- apiVersion: neuvector.com/v1
  kind: NvSecurityRule
  metadata:
    name: nv.bookinfo-gateway-istio.default
    namespace: default
  spec:
    dlp:
      settings: []
      status: true
    egress:
    - action: allow
      applications:
      - DNS
      name: nv.rke2-coredns-rke2-coredns.kube-system-egress-0
      ports: any
      priority: 0
      selector:
        comment: ""
        criteria:
        - key: service
          op: =
          value: rke2-coredns-rke2-coredns.kube-system
        - key: domain
          op: =
          value: kube-system
        name: nv.rke2-coredns-rke2-coredns.kube-system
        original_name: ""
    - action: allow
      applications:
      - SSL
      name: nv.istiod.istio-system-egress-1
      ports: any
      priority: 0
      selector:
        comment: ""
        criteria:
        - key: service
          op: =
          value: istiod.istio-system
        - key: domain
          op: =
          value: istio-system
        name: nv.istiod.istio-system
        original_name: ""
    file: []
    ingress:
    - action: allow
      applications:
      - HTTP
      name: nv.bookinfo-gateway-istio.default-ingress-0
      ports: any
      priority: 0
      selector:
        comment: ""
        name: nodes
        original_name: ""
    process:
    - action: allow
      allow_update: false
      name: envoy
      path: /usr/local/bin/envoy
    - action: allow
      allow_update: false
      name: pause
      path: /pause
    - action: allow
      allow_update: false
      name: pilot-agent
      path: /usr/local/bin/pilot-agent
    process_profile:
      baseline: zero-drift
      mode: Discover
    response: null
    target:
      policymode: Discover
      selector:
        comment: ""
        criteria:
        - key: service
          op: =
          value: bookinfo-gateway-istio.default
        - key: domain
          op: =
          value: default
        grp_band_width: 0
        grp_sess_cur: 0
        grp_sess_rate: 0
        mon_metric: false
        name: nv.bookinfo-gateway-istio.default
        original_name: ""
    waf:
      settings: []
      status: true
kind: List
metadata: {}
